<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      // Keeps AlphaScope's saved data in this browser's localStorage, so each
      // viewer has their own portfolio and it survives reloads and app updates.
      // It talks to Streamlit with the standard component messages.
      const STORAGE_KEY = "alphascope";
      let reported = false;

      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
      }

      function readStored() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          return { available: true, data: raw ? JSON.parse(raw) : {} };
        } catch (error) {
          // Private windows or blocked site data: the app still works, it just can't remember.
          return { available: false, data: {} };
        }
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        // The app only sends data after it has loaded what was stored, so a
        // fresh page can never overwrite saved data with the defaults.
        if (args.data !== null && args.data !== undefined) {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(args.data));
          } catch (error) {}
        }
        if (!reported) {
          reported = true;
          send("streamlit:setComponentValue", { value: readStored(), dataType: "json" });
        }
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </body>
</html>
